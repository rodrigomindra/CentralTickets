name: Reintento Ticket

on:

  issues:
    types:
      - labeled

permissions:
  issues: write

jobs:

  validar_reintento:

    if: github.event.label.name == 'reintentar'

    runs-on: ubuntu-latest

    outputs:

      es_regular: ${{ steps.validacion.outputs.es_regular }}

      es_express: ${{ steps.validacion.outputs.es_express }}

    steps:

      - name: Detectar tipo de ticket

        id: validacion

        run: |

          LABELS='${{ join(github.event.issue.labels.*.name, ',') }}'

          echo "Labels: $LABELS"

          if [[ "$LABELS" == *"ticket-regular"* ]]; then
            echo "es_regular=true" >> $GITHUB_OUTPUT
          else
            echo "es_regular=false" >> $GITHUB_OUTPUT
          fi

          if [[ "$LABELS" == *"ticket-express"* ]]; then
            echo "es_express=true" >> $GITHUB_OUTPUT
          else
            echo "es_express=false" >> $GITHUB_OUTPUT
          fi

  limpiar_labels:

    needs: validar_reintento

    runs-on: ubuntu-latest

    steps:

      - name: Limpiar labels de rechazo

        uses: actions/github-script@v7

        with:

          script: |

            const labelsAEliminar = [
              'rechazado',
              'pendiente-reintento',
              'reintentar',
              'reversion-completada'
            ];

            for (const label of labelsAEliminar) {

              try {

                await github.rest.issues.removeLabel({

                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label

                });

              } catch (error) {

                console.log(`Label ${label} no existe`);

              }

            }

            await github.rest.issues.createComment({

              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,

              body: '🔄 Reintento solicitado. Iniciando nuevamente el flujo del ticket.'

            });

  flujo_regular:

    needs:
      - validar_reintento
      - limpiar_labels

    if: needs.validar_reintento.outputs.es_regular == 'true'

    uses: ./.github/workflows/ticket-regular.yml

    secrets: inherit

    with:

      issue_number: ${{ github.event.issue.number }}

      issue_title: ${{ github.event.issue.title }}

      issue_author: ${{ github.event.issue.user.login }}

  flujo_express:

    needs:
      - validar_reintento
      - limpiar_labels

    if: needs.validar_reintento.outputs.es_express == 'true'

    uses: ./.github/workflows/ticket-express.yml

    secrets: inherit

    with:

      issue_number: ${{ github.event.issue.number }}

      issue_title: ${{ github.event.issue.title }}

      issue_author: ${{ github.event.issue.user.login }}
