name: Ticket Regular

on:
  issues:
    types: [opened]

jobs:

  solicitud_pase:

    if: contains(github.event.issue.labels.*.name, 'ticket-regular')

    runs-on: ubuntu-latest

    steps:

      - name: Inicializar solicitud

        run: |
          echo "Issue Regular recibida"
          echo "Numero: ${{ github.event.issue.number }}"
          echo "Titulo: ${{ github.event.issue.title }}"

  stage_revision_checklist:

    needs: solicitud_pase

    runs-on: ubuntu-latest

    environment: Revision-Checklist

    steps:

      - run: echo "Checklist aprobado"

  stage_aprobacion_seguridad:

    needs: stage_revision_checklist

    runs-on: ubuntu-latest

    environment: Aprobacion-Seguridad

    steps:

      - run: echo "Seguridad aprobada"

  stage_planificacion_y_configuracion_dataops:

    needs: stage_aprobacion_seguridad

    runs-on: ubuntu-latest

    environment: Planificacion-Ambiente-DataOps

    steps:

      - run: echo "Planificacion aprobada"

  stage_despliegue_remoto:

    needs: stage_planificacion_y_configuracion_dataops

    uses: ./.github/workflows/reusable-deploy.yml

    secrets: inherit

    with:

      repository: squad-pagos-db

      environment: QA

      script: V001__create_table.sql

  stage_validacion_funcional_steward:

    needs: stage_despliegue_remoto

    runs-on: ubuntu-latest

    environment: Validacion-Funcional-Steward

    steps:

      - run: |
          echo "Validacion funcional completada"
          echo "Pase cerrado"

  notificar_rechazo:

    needs:
      - stage_revision_checklist
      - stage_aprobacion_seguridad
      - stage_planificacion_y_configuracion_dataops
      - stage_despliegue_remoto
      - stage_validacion_funcional_steward

    if: failure()

    runs-on: ubuntu-latest

    steps:

      - run: |
          echo "El flujo Regular se detuvo por rechazo o error"
