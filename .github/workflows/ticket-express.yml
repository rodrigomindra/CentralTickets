name: Ticket Express

on:

  workflow_call:

    inputs:

      issue_number:
        required: true
        type: string

      issue_title:
        required: true
        type: string

      issue_author:
        required: true
        type: string

permissions:

  issues: write

jobs:

  solicitud_pase:

    runs-on: ubuntu-latest

    steps:

      - name: Inicializar solicitud

        run: |
          echo "Issue Express recibida"
          echo "Numero: ${{ inputs.issue_number }}"
          echo "Titulo: ${{ inputs.issue_title }}"
          echo "Solicitante: ${{ inputs.issue_author }}"

      - name: Registrar inicio

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: Number('${{ inputs.issue_number }}'),

              body: '✅ Solicitud de pase Express recibida. Inicio del flujo.'

            })

  stage_revision_checklist:

    needs: solicitud_pase

    runs-on: ubuntu-latest

    environment: Revision-Checklist

    steps:

      - run: echo "Checklist aprobado"

      - name: Registrar checklist

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: Number('${{ inputs.issue_number }}'),

              body: '✅ Checklist aprobado.'

            })

  stage_aprobacion_seguridad:

    needs: stage_revision_checklist

    runs-on: ubuntu-latest

    environment: Aprobacion-Seguridad

    steps:

      - run: echo "Seguridad aprobada"

      - name: Registrar seguridad

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: Number('${{ inputs.issue_number }}'),

              body: '✅ Aprobación de Seguridad completada.'

            })

  deploy_cert:

    needs: stage_aprobacion_seguridad

    uses: ./.github/workflows/deploy-cert.yml

    secrets: inherit

    with:

      repository: SquadCredicorpData

  comentario_cert:

    needs: deploy_cert

    runs-on: ubuntu-latest

    steps:

      - name: Registrar CERT

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: Number('${{ inputs.issue_number }}'),

              body: '✅ Despliegue en CERT completado.'

            })

  deploy_prod:

    needs: comentario_cert

    uses: ./.github/workflows/deploy-prod.yml

    secrets: inherit

    with:

      repository: SquadCredicorpData

  comentario_prod:

    needs: deploy_prod

    runs-on: ubuntu-latest

    steps:

      - name: Registrar PROD

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: Number('${{ inputs.issue_number }}'),

              body: '✅ Despliegue en PROD completado.'

            })

  stage_validacion_tecnica:

    needs: comentario_prod

    runs-on: ubuntu-latest

    environment: Validacion-Tecnica-Produccion

    steps:

      - run: |
          echo "Validando logs"
          echo "Validando jobs"
          echo "Validando pipelines"
          echo "Validacion tecnica OK"

      - name: Registrar validacion tecnica

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: Number('${{ inputs.issue_number }}'),

              body: '✅ Validación técnica en Producción completada.'

            })

      - name: Registrar cierre exitoso

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: Number('${{ inputs.issue_number }}'),

              body: '✅ Flujo Express completado exitosamente. Pendiente de cierre automático de la Issue.'

            })

  notificar_rechazo:

    needs:
      - stage_revision_checklist
      - stage_aprobacion_seguridad
      - deploy_cert
      - comentario_cert
      - deploy_prod
      - stage_validacion_tecnica

    if: failure()

    runs-on: ubuntu-latest

    steps:

      - run: |
          echo "El flujo Express se detuvo por rechazo o error"

      - name: Registrar error

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: Number('${{ inputs.issue_number }}'),

              body: '❌ El flujo Express se detuvo por rechazo o error.'

            })
