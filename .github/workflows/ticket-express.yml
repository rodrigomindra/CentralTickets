name: Ticket Express

on:

  workflow_call:

    inputs:

      issue_number:
        required: true
        type: string

      issue_title:
        required: true
        type: string

      issue_author:
        required: true
        type: string

jobs:

  solicitud_pase:

    runs-on: ubuntu-latest

    steps:

      - name: Inicializar solicitud

        run: |
          echo "Issue Express recibida"
          echo "Numero: ${{ inputs.issue_number }}"
          echo "Titulo: ${{ inputs.issue_title }}"
          echo "Solicitante: ${{ inputs.issue_author }}"

  stage_revision_checklist:

    needs: solicitud_pase

    runs-on: ubuntu-latest

    environment: Revision-Checklist

    steps:

      - run: echo "Checklist aprobado"

  stage_aprobacion_seguridad:

    needs: stage_revision_checklist

    runs-on: ubuntu-latest

    environment: Aprobacion-Seguridad

    steps:

      - run: echo "Seguridad aprobada"

  deploy_cert:

    needs: stage_aprobacion_seguridad

    uses: ./.github/workflows/reusable-deploy.yml

    secrets: inherit

    with:

      repository: SquadCredicorpData

      environment: CERT

      script: V001__create_table.sql

  deploy_prod:

    needs: deploy_cert

    uses: ./.github/workflows/reusable-deploy.yml

    secrets: inherit

    with:

      repository: SquadCredicorpData

      environment: PROD

      script: V001__create_table.sql

  stage_validacion_tecnica:

    needs: deploy_prod

    runs-on: ubuntu-latest

    environment: Validacion-Tecnica-Produccion

    steps:

      - run: |
          echo "Validando logs"
          echo "Validando jobs"
          echo "Validando pipelines"
          echo "Validacion tecnica OK"

  cierre_issue:

    needs: stage_validacion_tecnica

    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:

      - name: Cerrar Issue

        uses: actions/github-script@v7

        with:

          script: |

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              state: 'closed'
            })

      - name: Confirmacion

        run: |
          echo "Issue cerrada automaticamente"
          echo "Pase Express completado exitosamente"

  notificar_rechazo:

    needs:
      - stage_revision_checklist
      - stage_aprobacion_seguridad
      - deploy_cert
      - deploy_prod
      - stage_validacion_tecnica

    if: failure()

    runs-on: ubuntu-latest

    steps:

      - run: |
          echo "El flujo Express se detuvo por rechazo o error"
